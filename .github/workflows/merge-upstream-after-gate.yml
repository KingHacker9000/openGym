name: Merge upstream after gate

on:
  workflow_run:
    workflows: ["Upstream Gate"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  merge:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'automation/upstream-sync'
    runs-on: ubuntu-latest
    steps:
      - name: Merge the tested upstream PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          pr="$(gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --head automation/upstream-sync \
            --base main \
            --state open \
            --json number \
            --jq '.[0].number // empty')"
          if [ -z "$pr" ]; then
            echo "No open upstream-sync PR; nothing to merge."
            exit 0
          fi
          gh pr merge "$pr" --repo "$GITHUB_REPOSITORY" --merge --delete-branch
