name: Port AI Coach (one shot)

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  port:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/ai-coach-codex
          fetch-depth: 0

      - name: Skip when already ported
        id: check
        run: |
          if [ -f api/coach/config.js ]; then
            echo 'ported=true' >> "$GITHUB_OUTPUT"
            echo 'AI Coach is already present; nothing to cherry-pick.'
          else
            echo 'ported=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Configure git
        if: steps.check.outputs.ported != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch Alex AI Coach fork
        if: steps.check.outputs.ported != 'true'
        run: |
          git remote add alex https://github.com/alexpcosta/opengym.git
          git fetch alex main

      - name: Cherry-pick merged AI Coach feature
        if: steps.check.outputs.ported != 'true'
        shell: bash
        run: |
          set +e
          git cherry-pick -m 1 9a539b94282c9272d1e493debd85c3730077e15d
          rc=$?
          if [ $rc -ne 0 ]; then
            echo '::group::AI Coach cherry-pick conflicts'
            git status --short
            echo
            echo 'Conflicted files:'
            git diff --name-only --diff-filter=U
            echo '::endgroup::'
            exit $rc
          fi

      - name: Cherry-pick final Coach documentation cleanup
        if: steps.check.outputs.ported != 'true'
        shell: bash
        run: |
          set +e
          git cherry-pick -m 1 678bf5bf10446e8997a77d43e89c9b2721d8d0fc
          rc=$?
          if [ $rc -ne 0 ]; then
            echo '::group::Coach docs cherry-pick conflicts'
            git status --short
            echo
            echo 'Conflicted files:'
            git diff --name-only --diff-filter=U
            echo '::endgroup::'
            exit $rc
          fi

      - name: Push ported feature
        if: steps.check.outputs.ported != 'true'
        run: git push origin HEAD:feature/ai-coach-codex
