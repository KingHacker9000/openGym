# Safely tracks the GitHub mirror of the canonical openGym project.
# Upstream is NEVER merged directly into main. A conflict-free merge is pushed to an
# automation-owned branch and proposed as a PR; Upstream Gate tests it before a separate
# workflow is allowed to merge it.
name: Sync upstream safely

on:
  schedule:
    # Once a month is enough for this personal deployment; avoids chasing every minor upstream
    # change. The Pi deployment timer runs the following day after CI has had time to gate it.
    - cron: "23 4 1 * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Fetch mirror and prepare merge PR
        env:
          GH_TOKEN: ${{ github.token }}
          SYNC_BRANCH: automation/upstream-sync
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # GitHub mirror of the canonical Gitea project.
          git remote add upstream https://github.com/ramananbuilds/openGym.git
          git fetch upstream main --tags

          # If the newest mirror commit is already in our history, there is nothing to do.
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "Already contains the latest mirror commit."
            exit 0
          fi

          git checkout -B "$SYNC_BRANCH" main
          if ! git merge --no-ff --no-edit upstream/main; then
            echo "::error::Upstream no longer merges cleanly with our Coach fork. main was not changed."
            echo "Conflicted files:"
            git diff --name-only --diff-filter=U
            exit 1
          fi

          # This branch is owned only by this workflow, so replacing an older candidate is safe.
          git push --force origin "$SYNC_BRANCH"

          existing="$(gh pr list --head "$SYNC_BRANCH" --base main --state open --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            echo "Updated existing upstream PR #$existing"
          else
            gh pr create \
              --base main \
              --head "$SYNC_BRANCH" \
              --title "chore: sync latest openGym upstream" \
              --body "Automated monthly merge candidate from **ramananbuilds/openGym** (the GitHub mirror of the canonical Gitea upstream). This PR is merged automatically only after the read-only **Upstream Gate** passes. Merge conflicts or test/build failures leave `main` and the live server untouched."
          fi
